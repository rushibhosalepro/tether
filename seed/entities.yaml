# The ML layer showcase-ecommerce does not ship. Emitted on top of our own Snowflake-shaped
# datasets so the demo needs nothing but quickstart.
#
# IMPORTANT: lineage here is dataset-level (MLFeatureProperties.sources), because OSS DataHub
# does not accept column-level lineage on an mlFeature (verified 2026-08-09). Which columns a
# feature reads is proven from its SQL by the repair step, not stored on the edge.
#
# `declared: false` marks an edge nobody wrote down. In --partial mode (the realistic day-one
# graph) those edges are omitted, so the walk misses the model until Tether repairs it.
# The complete, correct edge set lives in ground_truth.yaml and is never read by the inferrer.

platform: mlflow
env: PROD

datasets:
  - name: analytics.public.orders
    platform: snowflake
    columns: [order_id, customer_id, created_at, quantity, unit_price, discount_pct, total_amount, status]
  - name: analytics.public.customers
    platform: snowflake
    columns: [customer_id, signup_date, country, lifetime_value, segment, support_tickets]
  - name: analytics.public.products
    platform: snowflake
    columns: [product_id, sku, category, unit_cost, list_price]

feature_tables:
  - name: customer_churn_features
    platform: feast
    description: Behavioural and monetary features for the churn models.
  - name: pricing_features
    platform: feast
    description: Inputs to the dynamic pricing model.

# Each feature is computed by a real SQL (or Python) file. The repair step parses that file to
# recover the source columns. `declared: false` = the edge is missing in the partial graph.
features:
  - name: discount_sensitivity
    table: customer_churn_features
    computed_by: features/discount_sensitivity.sql
    source_dataset: analytics.public.orders
    declared: false          # nobody wrote it down -> cold miss, repairable from SQL

  - name: avg_basket_value
    table: customer_churn_features
    computed_by: features/avg_basket_value.sql
    source_dataset: analytics.public.orders
    declared: true           # declared -> caught cold

  - name: order_frequency_90d
    table: customer_churn_features
    computed_by: features/order_frequency_90d.sql
    source_dataset: analytics.public.orders
    declared: true           # declared -> caught cold

  - name: margin_band
    table: pricing_features
    computed_by: features/margin_band.sql
    source_dataset: analytics.public.products
    declared: true           # declared -> caught cold

  - name: demand_index_7d
    table: pricing_features
    computed_by: features/demand_index_7d.sql
    source_dataset: analytics.public.orders
    declared: false          # nobody wrote it down -> cold miss, repairable from SQL

  - name: support_sentiment
    table: customer_churn_features
    computed_by: features/support_sentiment.py   # Python, no SQL to parse
    source_dataset: analytics.public.customers
    declared: false          # missing AND unfixable -> Tether must refuse to guess

model_groups:
  - name: churn_propensity
    description: Successive versions of the churn propensity model.
  - name: dynamic_pricing
    description: Price elasticity models serving the storefront.

models:
  - name: churn_propensity_v4
    group: churn_propensity
    description: Predicts 30-day churn. Serving on the retention email trigger.
    owners: [aman]
    last_trained: "2026-03-14"
    features: [discount_sensitivity, avg_basket_value, order_frequency_90d, support_sentiment]
    deployment: { name: churn-propensity-v4-serving, status: IN_SERVICE }

  - name: churn_propensity_v3
    group: churn_propensity
    description: Previous version, kept for comparison. Not serving.
    owners: [aman]
    last_trained: "2025-11-02"
    features: [discount_sensitivity]
    deployment: null

  - name: dynamic_pricing_v2
    group: dynamic_pricing
    description: Sets storefront price multipliers. The one that makes the money.
    owners: [wenjia]
    last_trained: "2026-06-20"
    features: [margin_band, demand_index_7d]
    deployment: { name: dynamic-pricing-v2-serving, status: IN_SERVICE }
