[project]
name = "tether"
version = "0.1.0"
description = "Blocks the PR that breaks the production model, and files the dependency back into DataHub."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
    "requests>=2.31",
    "sqlglot>=25.0",
    "acryl-datahub>=1.0.0",
    "anthropic>=0.40",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
tether = "tether.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
